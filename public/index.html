<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26272e">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button class="key key--fn" data-action="clear" id="clearBtn">AC</button>
      <button class="key key--fn" data-action="negate">+/-</button>
      <button class="key key--fn" data-action="percent">%</button>
      <button class="key key--op" data-action="divide">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key--op" data-action="multiply">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key key--op" data-action="subtract">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key key--op" data-action="add">+</button>

      <button class="key key--wide" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key--op key--equals" data-action="equals">=</button>

      <button class="key key--save key--wide" data-action="save" id="saveBtn">Save</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
